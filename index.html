<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyCoAnalysis: Cybersecurity Conference Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .conference-section {
            background: white;
            margin: 0 0 40px 0;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: left;
        }
        .conference-content {
            width: 100%;
            margin: 0 auto;
        }
        .flag-section {
            display: block;
            width: max-content;
            text-align: left;
            margin: 0 auto 20px auto;
        }
        .flag-section-container {
            display: block;
            min-width: 0;
        }
        .flag-section h4 {
            display: block;
            margin: 18px 0 8px;
            color: #2c3e50;
        }
        .conference-title {
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        #selector-container {
            max-width: 900px;
            margin: 0 auto 30px auto;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .selector-group {
            flex: 0 1 auto;
            min-width: 280px;
        }
        .selector-or {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #2c3e50;
            font-size: 1rem;
            min-width: 40px;
        }
        .conference-checkbox-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .conference-checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #f8f9fb;
            border: 1px solid #dde2ea;
            border-radius: 10px;
            padding: 10px 12px;
            color: #2c3e50;
            font-size: 0.95rem;
        }
        .conference-checkbox-item input {
            accent-color: #3498db;
        }
        .selector-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        #conference-select, #property-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .binary-sequence {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }
        .binary-sequence-item {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            line-height: 1;
            color: #fff;
            border: 1px solid #d1d5db;
            cursor: default;
            text-decoration: none;
        }
        .binary-sequence-item[href] {
            cursor: pointer;
        }
        .binary-sequence-item.off {
            background: #e2e8f0;
            color: #495057;
            border-color: #c4c8d2;
        }
        .binary-sequence-item.missing {
            background: #f8fafc;
            color: #6b7280;
            border-style: dashed;
            opacity: 0.95;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #7f8c8d;
            margin-top: 50px;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>CyCoAnalysis: Cybersecurity Conference Analysis</h1>
    </header>

    <div id="selector-container" class="conference-section" style="padding:18px 25px;">
        <div class="selector-group">
            <label for="conference-select">Choose a conference:</label>
            <select id="conference-select">
                <option value="">-- Select a conference --</option>
            </select>
        </div>
        <div class="selector-or">OR</div>
        <div class="selector-group">
            <label for="property-select">Choose a property:</label>
            <select id="property-select">
                <option value="">-- Select a property --</option>
            </select>
        </div>
    </div>

    <div id="content"></div>

    <footer>
        <p>Check out the more extensive raw data in the <a href="https://github.com/CyCoAnalysis/dataset">CyCoAnalysis dataset</a> and submit a pull request if you would like to contribute!</p>
        <p>Note that the website is AI-generated, but the underlying data was collected manually.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            init();
        });

        const conferenceNames = {
            sp: 'S&P',
            acsac: 'ACSAC',
            asiaccs: 'ASIACCS',
            ccs: 'CCS',
            csf: 'CSF',
            esorics: 'ESORICS',
            eurosp: 'EuroS&P',
            ndss: 'NDSS',
            raid: 'RAID',
            usenix: 'USENIX Security'
        };

        const flagConfigs = [
            {
                id: 'website',
                label: 'Website availability (clickable)',
                activeColor: '#2980b9',
                valueAccessor: result => result.websiteActive,
                linkAccessor: result => result.websiteLink
            },
            {
                id: 'anonymous',
                label: 'Anonymous submission',
                activeColor: '#8e44ad',
                valueAccessor: result => result.anonymous
            },
            {
                id: 'ethics',
                label: 'CFP discusses ethics',
                activeColor: '#16a085',
                valueAccessor: result => result.ethics
            },
            {
                id: 'conflicts',
                label: 'CFP discusses conflicts',
                activeColor: '#c0392b',
                valueAccessor: result => result.conflicts
            }
        ];

        const chartConfigs = [
            {
                id: 'chart-pc',
                heading: 'Size of the program committee',
                label: 'PC size',
                borderColor: '#e67e22',
                backgroundColor: 'rgba(230, 126, 34, 0.12)',
                valueAccessor: result => result.pcCount
            },
            {
                id: 'chart',
                heading: 'Number of topics of interest in the CFP',
                label: 'Number of topics',
                borderColor: '#3498db',
                backgroundColor: 'rgba(52, 152, 219, 0.1)',
                valueAccessor: result => result.topicCount
            }
        ];

        const conferenceColors = [
            '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
        ];

        const propertyConfigs = [
            ...flagConfigs.map(flag => ({ ...flag, type: 'binary' })),
            {
                id: 'pc',
                label: 'Program committee size',
                type: 'metric',
                heading: 'Program committee size',
                valueAccessor: result => result.pcCount
            },
            {
                id: 'topics',
                label: 'Number of CFP topics',
                type: 'metric',
                heading: 'Number of CFP topics',
                valueAccessor: result => result.topicCount
            }
        ];

        const analysisStartYear = 2005;
        const analysisEndYear = 2026;
        const loadingMessageHTML = '<p class="loading">Select a conference from the dropdown above to view its data or a property to see its evolution across all conferences.</p>';

        function createEl(tag, props = {}, children = []) {
            const element = document.createElement(tag);
            Object.entries(props).forEach(([key, value]) => {
                if (key === 'style' && typeof value === 'object') {
                    Object.assign(element.style, value);
                } else if (key in element) {
                    element[key] = value;
                } else {
                    element.setAttribute(key, value);
                }
            });
            const nodes = Array.isArray(children) ? children : [children];
            nodes.filter(Boolean).forEach(child => {
                element.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
            });
            return element;
        }

        function prettyConferenceName(confKey) {
            return conferenceNames[confKey] || confKey;
        }

        function createLoadingMessage() {
            return createEl('p', { className: 'loading', textContent: 'Loading...' });
        }

        async function init() {
            try {
                const contentDiv = document.getElementById('content');
                const conferenceSelect = document.getElementById('conference-select');
                const propertySelect = document.getElementById('property-select');
                contentDiv.innerHTML = loadingMessageHTML;

                Object.keys(conferenceNames).sort().forEach(conf => {
                    conferenceSelect.appendChild(createEl('option', {
                        value: conf,
                        textContent: prettyConferenceName(conf)
                    }));
                });

                propertyConfigs.forEach(property => {
                    propertySelect.appendChild(createEl('option', {
                        value: property.id,
                        textContent: property.label
                    }));
                });

                conferenceSelect.addEventListener('change', () => {
                    propertySelect.value = '';
                    const selected = conferenceSelect.value;
                    if (!selected) {
                        contentDiv.innerHTML = loadingMessageHTML;
                        return;
                    }

                    renderSelectedConference(selected);
                });

                propertySelect.addEventListener('change', () => {
                    conferenceSelect.value = '';
                    const selected = propertySelect.value;
                    if (!selected) {
                        contentDiv.innerHTML = loadingMessageHTML;
                        return;
                    }

                    renderPropertyForAllConferences(selected);
                });
            } catch (error) {
                console.error('Error initializing:', error);
                document.getElementById('content').innerHTML = '<p>Error initializing page. Please try again later.</p>';
            }
        }

        async function renderSelectedConference(conf) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';

            const section = createEl('div', { className: 'conference-section' });
            const contentWrapper = createEl('div', { className: 'conference-content' });

            contentWrapper.appendChild(createEl('h2', {
                className: 'conference-title',
                textContent: prettyConferenceName(conf)
            }));
            const loadingIndicator = createLoadingMessage();
            contentWrapper.appendChild(loadingIndicator);

            const flagTargets = {};
            flagConfigs.forEach(flag => {
                const { wrapper, container } = createFlagSection(flag.label, `${flag.id}-${conf}`);
                contentWrapper.appendChild(wrapper);
                flagTargets[flag.id] = container;
            });

            const chartTargets = {};
            chartConfigs.forEach(chartConfig => {
                chartTargets[chartConfig.id] = createChartCanvas(contentWrapper, chartConfig.heading, `${chartConfig.id}-${conf}`);
            });

            section.appendChild(contentWrapper);
            contentDiv.appendChild(section);

            const years = Array.from({ length: analysisEndYear - analysisStartYear + 1 }, (_, idx) => analysisStartYear + idx);
            try {
                await loadConferenceData(conf, years, chartTargets['chart'], chartTargets['chart-pc'], flagTargets);
            } finally {
                loadingIndicator.remove();
            }
        }

        async function renderPropertyForAllConferences(propertyId) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';

            const propertyConfig = propertyConfigs.find(p => p.id === propertyId);
            if (!propertyConfig) return;

            const section = createEl('div', { className: 'conference-section' });
            const contentWrapper = createEl('div', { className: 'conference-content' });

            contentWrapper.appendChild(createEl('h2', {
                className: 'conference-title',
                textContent: propertyConfig.label
            }));
            const loadingIndicator = createLoadingMessage();
            contentWrapper.appendChild(loadingIndicator);

            section.appendChild(contentWrapper);
            contentDiv.appendChild(section);

            try {
                if (propertyConfig.type === 'metric') {
                    await renderMetricPropertyView(propertyConfig, contentWrapper);
                } else {
                    const propertyListContainer = createEl('div', { id: `property-${propertyId}-list` });
                    contentWrapper.appendChild(propertyListContainer);
                    await loadPropertyDataForAllConferences(propertyId, propertyListContainer);
                }
            } finally {
                loadingIndicator.remove();
            }
        }

        async function loadPropertyDataForAllConferences(propertyId, propertyListContainer) {
            const flagConfig = flagConfigs.find(f => f.id === propertyId);
            if (!flagConfig) return;

            const years = Array.from({ length: analysisEndYear - analysisStartYear + 1 }, (_, idx) => analysisStartYear + idx);
            const conferencesData = {};

            for (const conf of Object.keys(conferenceNames)) {
                const dataPromises = years.map(async year => {
                    try {
                        const res = await fetch(`dataset/${conf}/${year}.yaml`);
                        if (!res.ok) {
                            return null;
                        }
                        const text = await res.text();
                        const yaml = jsyaml.load(text);
                        return parseConferenceYear(year, yaml);
                    } catch (e) {
                        return null;
                    }
                });

                const results = (await Promise.all(dataPromises)).filter(Boolean);
                if (results.length > 0) {
                    conferencesData[conf] = results;
                }
            }

            Object.keys(conferenceNames).sort().forEach(conf => {
                const results = conferencesData[conf] || [];
                if (results.length === 0) return;

                const { wrapper, container } = createFlagSection(prettyConferenceName(conf), `property-${propertyId}-${conf}`);
                propertyListContainer.appendChild(wrapper);
                renderBinarySequence(container, results, flagConfig.valueAccessor, flagConfig.activeColor, flagConfig.linkAccessor, { showAllYears: true });
            });
        }

        async function renderMetricPropertyView(propertyConfig, contentWrapper) {
            const chartWrapper = createEl('div', { className: 'chart-container' });
            const chartCanvas = createEl('canvas', { id: `metric-chart-${propertyConfig.id}` });
            chartWrapper.appendChild(chartCanvas);
            contentWrapper.appendChild(chartWrapper);
            const checkboxContainer = createEl('div', { id: `conference-checkboxes-${propertyConfig.id}` });
            contentWrapper.appendChild(checkboxContainer);
            await loadMetricPropertyData(propertyConfig, chartCanvas, checkboxContainer);
        }

        async function loadMetricPropertyData(propertyConfig, chartCanvas, checkboxContainer) {
            const years = Array.from({ length: analysisEndYear - analysisStartYear + 1 }, (_, idx) => analysisStartYear + idx);
            const conferenceData = {};
            const conferenceLabels = Object.keys(conferenceNames).sort();

            for (const conf of conferenceLabels) {
                const dataPromises = years.map(async year => {
                    try {
                        const res = await fetch(`dataset/${conf}/${year}.yaml`);
                        if (!res.ok) {
                            return null;
                        }
                        const text = await res.text();
                        const yaml = jsyaml.load(text);
                        return parseConferenceYear(year, yaml);
                    } catch (e) {
                        return null;
                    }
                });

                const results = (await Promise.all(dataPromises)).filter(Boolean);
                if (results.length > 0) {
                    conferenceData[conf] = results;
                }
            }

            const availableConferences = Object.keys(conferenceData).sort();
            if (availableConferences.length === 0) {
                checkboxContainer.appendChild(createEl('p', { textContent: 'No conference data available for this property.' }));
                return;
            }

            const chart = new Chart(chartCanvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: years,
                    datasets: buildMetricDatasets(availableConferences, conferenceData, years, propertyConfig)
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    spanGaps: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: propertyConfig.label
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Year'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        }
                    }
                }
            });

            createMetricCheckboxes(checkboxContainer, availableConferences, chart, conferenceData, propertyConfig, years);
        }

        function buildMetricDatasets(conferenceIds, conferenceData, years, propertyConfig) {
            return conferenceIds.map((conf, index) => {
                const resultByYear = Object.fromEntries(conferenceData[conf].map(result => [result.year, result]));
                return {
                    label: prettyConferenceName(conf),
                    data: years.map(year => {
                        const result = resultByYear[year];
                        return result ? propertyConfig.valueAccessor(result) : null;
                    }),
                    borderColor: conferenceColors[index % conferenceColors.length],
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    fill: false,
                    tension: 0.1,
                    pointRadius: 3,
                    spanGaps: false,
                    hidden: false
                };
            });
        }

        function createMetricCheckboxes(container, conferenceIds, chart, conferenceData, propertyConfig, years) {
            container.innerHTML = '';
            const list = createEl('div', { className: 'conference-checkbox-list' });

            conferenceIds.forEach((conf, index) => {
                const checkboxId = `checkbox-${propertyConfig.id}-${conf}`;
                const input = createEl('input', {
                    type: 'checkbox',
                    id: checkboxId,
                    checked: true,
                    'data-conf': conf
                });
                const label = createEl('label', { className: 'conference-checkbox-item', htmlFor: checkboxId }, [
                    input,
                    createEl('span', { textContent: prettyConferenceName(conf) })
                ]);

                input.addEventListener('change', () => {
                    chart.data.datasets[index].hidden = !input.checked;
                    chart.update();
                });

                list.appendChild(label);
            });

            container.appendChild(list);
        }

        async function loadConferenceData(conf, years, topicCanvas, pcCanvas, flagTargets) {
            const dataPromises = years.map(async year => {
                try {
                    const res = await fetch(`dataset/${conf}/${year}.yaml`);
                    if (!res.ok) {
                        return null;
                    }
                    const text = await res.text();
                    const yaml = jsyaml.load(text);
                    return parseConferenceYear(year, yaml);
                } catch (e) {
                    console.warn(`Skipping missing or invalid dataset file for ${conf} ${year}:`, e);
                    return null;
                }
            });

            const results = (await Promise.all(dataPromises)).filter(Boolean);
            flagConfigs.forEach(flag => {
                const target = flagTargets[flag.id];
                if (!target) return;
                if (results.length === 0) {
                    renderBinarySequence(target, results, flag.valueAccessor, flag.activeColor, flag.linkAccessor);
                    return;
                }
                const yearsPresent = results.map(r => r.year).sort((a, b) => a - b);
                const minY = yearsPresent[0];
                const maxY = yearsPresent[yearsPresent.length - 1];
                const yearSet = new Set(yearsPresent);
                let hasGap = false;
                for (let y = minY; y <= maxY; y++) {
                    if (!yearSet.has(y)) { hasGap = true; break; }
                }
                if (hasGap) {
                    renderBinarySequence(target, results, flag.valueAccessor, flag.activeColor, flag.linkAccessor, { rangeStart: minY, rangeEnd: maxY });
                } else {
                    renderBinarySequence(target, results, flag.valueAccessor, flag.activeColor, flag.linkAccessor);
                }
            });
            chartConfigs.forEach(chartConfig => {
                const canvas = chartConfig.id === 'chart' ? topicCanvas : pcCanvas;
                renderChart(canvas, chartConfig.label, results, chartConfig.borderColor, chartConfig.backgroundColor, chartConfig.valueAccessor);
            });
        }

        function parseConferenceYear(year, yaml) {
            return {
                year,
                topicCount: countTopics(yaml.topics),
                pcCount: countPCStrings(yaml.pc),
                anonymous: !!yaml['anonymous'],
                ethics: !!yaml['ethics-discussion'],
                conflicts: !!yaml['conflicts'],
                websiteActive: Boolean(yaml.website && yaml.website.url != null),
                websiteLink: yaml.website && typeof yaml.website === 'object' ? yaml.website.url || yaml.website.archive || null : null
            };
        }

        function countPCStrings(pcValue) {
            if (!Array.isArray(pcValue)) {
                return 0;
            }
            return pcValue.reduce((sum, entry) => {
                if (entry && typeof entry === 'object') {
                    Object.values(entry).forEach(value => {
                        if (Array.isArray(value)) {
                            sum += value.filter(item => typeof item === 'string').length;
                        }
                    });
                }
                return sum;
            }, 0);
        }

        function countTopics(topicsValue) {
            if (topicsValue == null) return 0;
            function rec(v) {
                if (v == null) return 0;
                if (typeof v === 'string') return 1;
                if (Array.isArray(v)) return v.reduce((s, e) => s + rec(e), 0);
                if (typeof v === 'object') return Object.values(v).reduce((s, e) => s + rec(e), 0);
                return 0;
            }
            return rec(topicsValue);
        }

        function createChartCanvas(parent, headingText, canvasId) {
            parent.appendChild(createEl('h3', {
                textContent: headingText,
                style: { marginTop: '0', color: '#34495e' }
            }));
            const container = createEl('div', { className: 'chart-container' });
            const canvas = createEl('canvas', { id: canvasId });
            container.appendChild(canvas);
            parent.appendChild(container);
            return canvas;
        }

        function renderChart(canvas, label, results, borderColor, backgroundColor, valueAccessor) {
            const ctx = canvas.getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: results.map(result => result.year),
                    datasets: [{
                        label,
                        data: results.map(valueAccessor),
                        borderColor,
                        backgroundColor,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Count'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Year'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function createFlagSection(label, containerId) {
            const wrapper = createEl('div', { className: 'flag-section' });
            wrapper.appendChild(createEl('h4', { textContent: label }));
            const container = createEl('div', {
                className: 'flag-section-container',
                id: containerId
            });
            wrapper.appendChild(container);
            return { wrapper, container };
        }

        function renderBinarySequence(container, results, valueAccessor, activeColor, linkAccessor, options = {}) {
            // options: { showAllYears: boolean }
            container.innerHTML = '';
            const sequence = createEl('div', { className: 'binary-sequence' });

            if (options.rangeStart != null && options.rangeEnd != null) {
                const byYear = {};
                results.forEach(r => { byYear[r.year] = r; });
                for (let y = options.rangeStart; y <= options.rangeEnd; y++) {
                    const result = byYear[y] || null;
                    const hasData = !!result;
                    const value = hasData ? Boolean(valueAccessor(result)) : false;
                    const link = hasData && linkAccessor ? linkAccessor(result) : null;
                    const item = createEl(link ? 'a' : 'div', { className: 'binary-sequence-item' });
                    if (!hasData) {
                        item.classList.add('missing');
                        item.classList.add('off');
                    } else if (!value) {
                        item.classList.add('off');
                    }
                    if (link) {
                        item.href = link;
                        item.target = '_blank';
                        item.rel = 'noopener noreferrer';
                    }
                    item.style.background = (hasData && value) ? activeColor : '';
                    item.textContent = String(y).slice(-2);
                    item.title = hasData ? `${y}: ${value ? 'yes' : 'no'}` + (link ? `\nLink: ${link}` : '') : `${y}: (no data)`;
                    sequence.appendChild(item);
                }
            } else if (options.showAllYears) {
                const byYear = {};
                results.forEach(r => { byYear[r.year] = r; });
                for (let y = analysisStartYear; y <= analysisEndYear; y++) {
                    const result = byYear[y] || null;
                    const hasData = !!result;
                    const value = hasData ? Boolean(valueAccessor(result)) : false;
                    const link = hasData && linkAccessor ? linkAccessor(result) : null;
                    const item = createEl(link ? 'a' : 'div', { className: 'binary-sequence-item' });
                    if (!hasData) {
                        item.classList.add('missing');
                        item.classList.add('off');
                    } else if (!value) {
                        item.classList.add('off');
                    }
                    if (link) {
                        item.href = link;
                        item.target = '_blank';
                        item.rel = 'noopener noreferrer';
                    }
                    item.style.background = (hasData && value) ? activeColor : '';
                    item.textContent = String(y).slice(-2);
                    item.title = hasData ? `${y}: ${value ? 'yes' : 'no'}` + (link ? `\nLink: ${link}` : '') : `${y}: (no data)`;
                    sequence.appendChild(item);
                }
            } else {
                results.forEach(result => {
                    const value = Boolean(valueAccessor(result));
                    const link = linkAccessor ? linkAccessor(result) : null;
                    const item = createEl(link ? 'a' : 'div', { className: 'binary-sequence-item' });
                    if (!value) {
                        item.classList.add('off');
                    }
                    if (link) {
                        item.href = link;
                        item.target = '_blank';
                        item.rel = 'noopener noreferrer';
                    }
                    item.style.background = value ? activeColor : '';
                    item.textContent = String(result.year).slice(-2);
                    item.title = `${result.year}: ${value ? 'yes' : 'no'}` + (link ? `\nLink: ${link}` : '');
                    sequence.appendChild(item);
                });
            }

            container.appendChild(sequence);
        }
    </script>
</body>
</html>
